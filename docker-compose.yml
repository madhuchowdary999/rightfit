services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rightfit
      POSTGRES_PASSWORD: rightfit_dev
      POSTGRES_DB: rightfit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rightfit:rightfit_dev@db:5432/rightfit
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
