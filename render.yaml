services:
  - type: web
    name: rightfit-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rightfit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
  - type: web
    name: rightfit-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
databases:
  - name: rightfit-db
    plan: free
